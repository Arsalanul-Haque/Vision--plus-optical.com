<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Plus – AI Try-On</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }
    #video {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      margin-top: 20px;
    }
    #canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
    .frame-selector img {
      width: 80px;
      margin: 5px;
      cursor: pointer;
      border: 2px solid white;
      border-radius: 5px;
    }
    .frame-selector img.selected {
      border-color: gold;
    }
  </style>
</head>
<body>
  <h2>Vision Plus – AI Try-On</h2>

  <!-- Camera Video -->
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- Frame Selector -->
  <div class="frame-selector">
    <img src="frames/frame1.png" class="selected" alt="Frame 1">
    <img src="frames/frame2.png" alt="Frame 2">
    <img src="frames/frame3.png" alt="Frame 3">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let selectedFrame = document.querySelector(".frame-selector img.selected");
    const frames = document.querySelectorAll(".frame-selector img");

    frames.forEach(img => {
      img.addEventListener("click", () => {
        frames.forEach(f => f.classList.remove("selected"));
        img.classList.add("selected");
        selectedFrame = img;
      });
    });

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    async function main() {
      await setupCamera();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const model = await faceLandmarksDetection.load(
        faceLandmarksDetection.SupportedPackages.mediapipeFacemesh
      );

      async function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const predictions = await model.estimateFaces({input: video});

        if (predictions.length > 0) {
          predictions.forEach(pred => {
            const leftEye = pred.scaledMesh[33]; // left eye
            const rightEye = pred.scaledMesh[263]; // right eye

            const frameWidth = (rightEye[0] - leftEye[0]) * 2.5;
            const frameHeight = frameWidth / selectedFrame.naturalWidth * selectedFrame.naturalHeight;

            const x = leftEye[0] - frameWidth * 0.25;
            const y = leftEye[1] - frameHeight * 0.5;

            ctx.drawImage(selectedFrame, x, y, frameWidth, frameHeight);
          });
        }

        requestAnimationFrame(render);
      }

      render();
    }

    main();
  </script>
</body>
</html>
