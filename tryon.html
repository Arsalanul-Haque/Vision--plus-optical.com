<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
}
h1{padding:15px;}

#stage{
    position:relative;
    width:90vw;
    max-width:400px;
    margin:auto;
}

#photo{
    width:100%;
    border-radius:15px;
    display:none;
}

#frame{
    position:absolute !important;
    top:0;
    left:0;
    pointer-events:none;
    display:none;
    z-index:9999;
}
#stage{
    position:relative !important;
}

button{
    padding:14px 30px;
    margin:10px;
    border:none;
    border-radius:12px;
    background:#ff9800;
    font-size:16px;
}

#fileInput{display:none;}
#tryNext{display:none;}
</style>
</head>

<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="stage">
    <img id="photo">
    <img id="3812-removebg-preview.png">
</div>

<button id="uploadBtn">Upload Your Photo</button>
<input type="file" id="fileInput" accept="image/*">

<br>
<button id="tryNext">Try Next Frame</button>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></scri
    <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script>
const imageUpload = document.getElementById("imageUpload");
const userImg = document.getElementById("userImage");
const frame = document.getElementById("frame");
const tryNextBtn = document.getElementById("tryNext");

const frames = [
  "frame1.png",
  "frame2.png",
  "frame3.png",
  "frame4.png"
];
let currentFrame = 0;

// Load face api models
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/models'),
  faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/models')
]);

imageUpload.addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function () {
    userImg.src = reader.result;
  };
  reader.readAsDataURL(file);

  userImg.onload = async function () {
    detectFace();
    tryNextBtn.style.display = "block";
  };
});

tryNextBtn.addEventListener("click", () => {
  currentFrame = (currentFrame + 1) % frames.length;
  frame.src = frames[currentFrame];
  detectFace();
});

async function detectFace() {
  const detection = await faceapi.detectSingleFace(userImg, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks();

  if (!detection) return;

  const leftEye = detection.landmarks.getLeftEye();
  const rightEye = detection.landmarks.getRightEye();

  const eyeCenterX = (leftEye[0].x + rightEye[3].x) / 2;
  const eyeCenterY = (leftEye[0].y + rightEye[3].y) / 2;

  const eyeWidth = rightEye[3].x - leftEye[0].x;

  frame.style.display = "block";
  frame.style.width = eyeWidth * 2 + "px";
  frame.style.left = userImg.offsetLeft + eyeCenterX - (eyeWidth) + "px";
  frame.style.top = userImg.offsetTop + eyeCenterY - (eyeWidth / 2) + "px";
}
</script>
</body>
</html>
