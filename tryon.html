<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Plus – AI Try-On</title>
<style>
  body {margin:0;font-family:Arial,sans-serif;text-align:center;background:#111;color:white;}
  video {width:100%;max-width:400px;border-radius:12px;margin-top:15px;}
  .frames {margin-top:15px;display:flex;justify-content:center;gap:10px;}
  .frames img {width:80px;height:50px;object-fit:cover;border:2px solid #fff;border-radius:8px;cursor:pointer;}
  .frames img.selected {border:2px solid yellow;}
  canvas {position:absolute;top:0;left:0;}
</style>
</head>
<body>

<h1>Vision Plus – AI Try-On</h1>
<div style="position:relative;display:inline-block;">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div class="frames">
  <img src="frames/frame1.png" id="f1" onclick="selectFrame('f1')">
  <img src="frames/frame2.png" id="f2" onclick="selectFrame('f2')">
  <img src="frames/frame3.png" id="f3" onclick="selectFrame('f3')">
</div>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let selectedFrame = null;

navigator.mediaDevices.getUserMedia({video:true})
.then(stream => { video.srcObject = stream; })
.catch(err => { alert("Camera access denied: "+err); });

function selectFrame(id){
  document.querySelectorAll('.frames img').forEach(img => img.classList.remove('selected'));
  document.getElementById(id).classList.add('selected');
  selectedFrame = document.getElementById(id);
}

video.addEventListener('play', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    if(selectedFrame){
      ctx.drawImage(selectedFrame,canvas.width/4,canvas.height/4,canvas.width/2,canvas.height/4);
    }
    requestAnimationFrame(draw);
  }
  draw();
});
</script>

</body>
</html>
