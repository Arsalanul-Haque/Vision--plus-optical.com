<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    margin:0;
    background:#000;
    font-family:Arial;
    color:white;
    text-align:center;
}

h1{
    margin:15px 0;
}

#container{
    position:relative;
    width:90vw;
    max-width:400px;
    margin:auto;
    background:#111;
    border-radius:20px;
    overflow:hidden;
}

#userPhoto{
    width:100%;
    display:block;
}

#glasses{
    position:absolute;
    top:40%;
    left:50%;
    width:200px;
    transform:translate(-50%, -50%);
    cursor:move;
    touch-action:none;
}

.controls{
    margin-top:10px;
}

button{
    background:orange;
    border:none;
    padding:10px 18px;
    margin:5px;
    border-radius:10px;
    font-size:16px;
}
input{
    margin-top:10px;
}
</style>
</head>

<body>

<h1>Vision Plus Optical</h1>

<input type="file" accept="image/*" id="upload">

<div id="container">
    <img id="userPhoto">
    <img id="glasses" src="3812-removebg-preview.png">
</div>

<div class="controls">
    <button onclick="scale(1.1)">Zoom +</button>
    <button onclick="scale(0.9)">Zoom -</button>
    <button onclick="rotate(-5)">⟲ Rotate</button>
    <button onclick="rotate(5)">⟳ Rotate</button>
</div>

<script>
let glasses = document.getElementById("glasses");
let upload = document.getElementById("upload");
let userPhoto = document.getElementById("userPhoto");

upload.onchange = e =>{
    let file = e.target.files[0];
    let reader = new FileReader();
    reader.onload = () => userPhoto.src = reader.result;
    reader.readAsDataURL(file);
};

let x=0,y=0,scaleVal=1,rot=0;

glasses.addEventListener("pointerdown",e=>{
    glasses.setPointerCapture(e.pointerId);
    startX = e.clientX - x;
    startY = e.clientY - y;

    glasses.onpointermove = e=>{
        x = e.clientX - startX;
        y = e.clientY - startY;
        update();
    }

    glasses.onpointerup = ()=>{
        glasses.onpointermove=null;
    }
});

function scale(val){
    scaleVal *= val;
    update();
}

function rotate(val){
    rot += val;
    update();
}

function update(){
    glasses.style.transform =
    `translate(${x}px,${y}px) scale(${scaleVal}) rotate(${rot}deg)`;
}
</script>

</body>
</html>
