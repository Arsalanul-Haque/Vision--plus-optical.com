<!DOCTYPE html>
<html>
<head>
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
header{background:black;padding:15px;font-size:22px}
#canvas{width:100%;max-width:380px;border-radius:15px}
button{padding:10px 15px;margin:8px;background:#ff9800;border:none;border-radius:8px}
</style>
</head>

<body>

<header>Vision Plus Optical – AI Try On</header>

<canvas id="canvas"></canvas><br>

<input type="file" id="upload" accept="image/*"><br>
<button onclick="changeFrame()">Change Frame</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const upload=document.getElementById("upload");

let frames=["3812-removebg-preview.png"];
let frameIndex=0;
let frame=new Image();
frame.src=frames[0];

const faceMesh=new FaceMesh({
 locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true});

let img=new Image();

upload.onchange=e=>{
 img.src=URL.createObjectURL(e.target.files[0]);
 img.onload=()=>processImage();
};

function changeFrame(){
 frameIndex=(frameIndex+1)%frames.length;
 frame.src=frames[frameIndex];
 processImage();
}

function processImage(){
 canvas.width=img.width;
 canvas.height=img.height;
 ctx.drawImage(img,0,0);
 faceMesh.send({image:img});
}

faceMesh.onResults(r=>{
 if(!r.multiFaceLandmarks) return;
 let p=r.multiFaceLandmarks[0];

 let left = p[130];   // left eye outer
let right = p[359]; // right eye outer

let eyeTop = (p[159].y + p[386].y) / 2;

 let eyeLeft = p[33];
let eyeRight = p[263];
let eyeMidY = (p[159].y + p[145].y) / 2;

let w = (eyeRight.x - eyeLeft.x) * canvas.width * 1.6;
let h = w / 2.8;

let x = eyeLeft.x * canvas.width - w * 0.2;
let y = eyeMidY * canvas.height - h * 0.45;

ctx.drawImage(frame, x, y, w, h);
</script>

</body>
</html>
