<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Plus Optical – AI Try On</title>
<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
}
h1{padding:15px;}
#stage{
    position:relative;
    width:90vw;
    max-width:400px;
    margin:auto;
}
#photo{
    width:100%;
    border-radius:15px;
}
#frame{
    position:absolute;
    pointer-events:none;
    display:none;
}
button{
    padding:14px 30px;
    margin:10px;
    border:none;
    border-radius:12px;
    background:#ff9800;
    font-size:16px;
    cursor:pointer;
}
#tryNext{
    display:none;
}
#fileInput{
    display:none;
}
</style>
</head>
<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="stage">
    <img id="photo">
    <img id="frame" src="remove-preview.png">
</div>

<button id="uploadBtn">Upload Your Photo</button>
<input type="file" id="fileInput" accept="image/*">

<br>
<button id="tryNext">Try Next Frame</button>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script>
const frames = ["3812-removebg-preview.png"]; // add more frames if needed
let currentFrame = 0;

const photo = document.getElementById("photo");
const frame = document.getElementById("frame");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const tryNextBtn = document.getElementById("tryNext");

// Load face-api models
async function loadModels(){
    await faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models");
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models");
}

loadModels();

// Upload photo
uploadBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async e => {
    const file = e.target.files[0];
    if(!file) return;

    photo.src = URL.createObjectURL(file);
    frame.style.display = "block";
    tryNextBtn.style.display = "inline-block";
    uploadBtn.style.display = "none";

    // Wait for image to load
    photo.onload = async () => {
        await detectFaceAndPlaceFrame();
    };
});

// Try next frame
tryNextBtn.addEventListener("click", () => {
    currentFrame = (currentFrame + 1) % frames.length;
    frame.src = frames[currentFrame];
    detectFaceAndPlaceFrame(); // reposition frame after switching
});

// Detect face and position frame
async function detectFaceAndPlaceFrame(){
    const detection = await faceapi.detectSingleFace(photo, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true);
    if(!detection) return;

    const landmarks = detection.landmarks;
    const leftEye = landmarks.getLeftEye();
    const rightEye = landmarks.getRightEye();

    // Calculate center between eyes
    const eyeCenterX = (leftEye[0].x + rightEye[3].x)/2;
    const eyeCenterY = (leftEye[0].y + rightEye[3].y)/2;

    // Calculate frame size based on distance between eyes
    const eyeDist = Math.abs(rightEye[3].x - leftEye[0].x);
    const frameWidth = eyeDist * 2; // adjust multiplier for bigger frame
    const frameHeight = frameWidth / 2; // adjust ratio

    // Set frame style
    frame.style.width = frameWidth + "px";
    frame.style.height = frameHeight + "px";
    frame.style.left = (eyeCenterX - frameWidth/2) + "px";
    frame.style.top = (eyeCenterY - frameHeight/2) + "px";
}
</script>
</body>
</html>
