<!DOCTYPE html>
<html>
<head>
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
header{background:black;padding:15px;font-size:22px}
.camera{position:relative;display:inline-block}
video,canvas{width:100%;max-width:380px;border-radius:15px}
canvas{position:absolute;left:0;top:0}
button{padding:10px 15px;margin:8px;background:#ff9800;border:none;border-radius:8px}
</style>
</head>
<body>

<header>Vision Plus Optical – AI Try On</header>

<div class="camera">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<br>
<input type="file" id="upload" accept="image/*">
<br>
<button onclick="switchCamera()">Switch Camera</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let frame = new Image();
frame.src = "Frame/Frame.png";

const faceMesh = new FaceMesh({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true
});

faceMesh.onResults(results => {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(results.multiFaceLandmarks){
    let p = results.multiFaceLandmarks[0];
    let left = p[33];
    let right = p[263];

    let x = left.x * canvas.width;
    let y = left.y * canvas.height;
    let w = (right.x - left.x) * canvas.width;

    ctx.drawImage(frame, x-40, y-40, w+80,
  }
});

const camera = new Camera(video,{
  onFrame: async()=>{
    await faceMesh.send({image:video});
  },
  width:360,
  height:480
let eyeCenterY = (p[159].y + p[145].y) / 2 * canvas.height;

let glassesWidth = w * 1.6;
let glassesHeight = glassesWidth / 2.5;

let gx = x - glassesWidth * 0.25;
let gy = eyeCenterY - glassesHeight / 2;

ctx.drawImage(frame, gx, gy, glassesWidth, glassesHeight);});
camera.start();

function switchCamera(){
  location.reload();
}

document.getElementById("upload").onchange = e=>{
  let img = new Image();
  img.src = URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img,0,0);
  }
}
</script>

</body>
</html>
