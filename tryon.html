<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – Virtual Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

header{
    background:#000;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:20px;
}

#camera{
    width:100%;
    max-width:400px;
    border-radius:15px;
}

#frame{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:280px;
    pointer-events:none;
}

.camera-box{
    position:relative;
    display:inline-block;
}

.controls{
    margin-top:15px;
}

button{
    padding:10px 20px;
    border:none;
    background:#ff9800;
    color:black;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#ffc107;
}
</style>
</head>

<body>

<header>Vision Plus Optical – Try On</header>

<div class="container">
    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
        <img id="frame" src="Frame/Frame.png">
    </div>

    <div class="controls">
        <button onclick="switchCamera()">Switch Camera</button>
    </div>
</div>

<script>
let cameraFacing = "user";
let video = document.getElementById("camera");

async function startCamera(){
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        try{
            const stream = await navigator.mediaDevices.getUserMedia({
                video:{ facingMode: cameraFacing }
            });
            video.srcObject = stream;
        }catch(e){
            alert("Camera access denied");
        }
    }
}

function switchCamera(){
    cameraFacing = cameraFacing === "user" ? "environment" : "user";
    startCamera();
}

startCamera();
</script>

</body>
</html>
