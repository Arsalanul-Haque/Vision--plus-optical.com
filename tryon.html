<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – Virtual Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#111;color:white;text-align:center;}
header{background:#000;padding:15px;font-size:22px;font-weight:bold;}
.container{padding:20px;}
.camera-box{position:relative;display:inline-block;}
#camera{width:100%;max-width:400px;border-radius:15px;}
#overlay{position:absolute;top:0;left:0;}
.controls{margin-top:15px;}
button{padding:10px 20px;border:none;background:#ff9800;color:black;font-size:16px;border-radius:8px;cursor:pointer;}
button:hover{background:#ffc107;}
</style>
</head>
<body>

<header>Vision Plus Optical – Try On</header>
<div class="container">
    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
        <button onclick="switchCamera()">Switch Camera</button>
    </div>
</div>

<!-- face-api.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script>
let cameraFacing = "user";
const video = document.getElementById("camera");
const canvas = document.getElementById("overlay");
const frameImg = new Image();
frameImg.src = "Frame/Frame.png"; // Transparent glasses frame

async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing}});
    video.srcObject = stream;
    video.onloadedmetadata = () => { video.play(); canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
}

function switchCamera(){
    cameraFacing = cameraFacing==="user"?"environment":"user";
    startCamera();
}

async function startFaceDetection(){
    await faceapi.nets.tinyFaceDetector.loadFromUri('/models'); // Download models folder
    setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions());
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0,0,canvas.width,canvas.height);
        detections.forEach(det => {
            const {x,y,width,height} = det.box;
            // Draw frame over face
            ctx.drawImage(frameImg,x-20,y-20,width+40,height+40);
        });
    },100);
}

startCamera();
startFaceDetection();
</script>

</body>
</html>
