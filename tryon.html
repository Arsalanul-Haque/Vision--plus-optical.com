<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial;
text-align:center;
}

h1{
padding:15px;
}

#stage{
position:relative;
width:90%;
max-width:360px;
margin:auto;
border-radius:20px;
overflow:hidden;
background:#111;
}

#userImage{
width:100%;
display:none;
}

#glasses{
position:absolute;
top:0;
left:0;
pointer-events:none;
display:none;
}

button{
margin:15px;
padding:14px 30px;
font-size:18px;
border:none;
border-radius:12px;
background:#ff9800;
cursor:pointer;
}

input{
display:none;
}
</style>
</head>

<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="stage">
    <img id="userImage">
    <img id="glasses" src="3812-removebg-preview.png">
</div>

<input type="file" id="upload" accept="image/*">

<button id="uploadBtn">Upload Your Photo</button>
<button id="retryBtn" style="display:none;">Try Again</button>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const retryBtn = document.getElementById("retryBtn");
const upload = document.getElementById("upload");
const userImage = document.getElementById("userImage");
const glasses = document.getElementById("glasses");

uploadBtn.onclick = () => upload.click();

upload.onchange = () => {
 const file = upload.files[0];
 if(!file) return;
 const reader = new FileReader();
 reader.onload = () => {
   userImage.src = reader.result;
   userImage.style.display="block";
   uploadBtn.style.display="none";
 };
 reader.readAsDataURL(file);
};

retryBtn.onclick = () => {
 glasses.style.display="none";
 userImage.style.display="none";
 uploadBtn.style.display="inline-block";
 retryBtn.style.display="none";
};

Promise.all([
 faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights"),
 faceapi.nets.faceLandmark68Net.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights")
]);

userImage.onload = async () => {
 const result = await faceapi
   .detectSingleFace(userImage, new faceapi.TinyFaceDetectorOptions())
   .withFaceLandmarks();

 if(!result){
   alert("Face not detected. Try clear front face photo.");
   return;
 }

 const leftEye = result.landmarks.getLeftEye();
 const rightEye = result.landmarks.getRightEye();

 const eyeLeft = leftEye[0];
 const eyeRight = rightEye[3];

 const eyeWidth = eyeRight.x - eyeLeft.x;
 const centerX = (eyeLeft.x + eyeRight.x) / 2;
 const centerY = (eyeLeft.y + eyeRight.y) / 2;

 glasses.style.width = eyeWidth * 2 + "px";
 glasses.style.left = centerX - eyeWidth + "px";
 glasses.style.top = centerY - eyeWidth * 0.5 + "px";
 glasses.style.display="block";

 retryBtn.style.display="inline-block";
};
</script>

</body>
</html>
