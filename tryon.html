<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus – AI Try On</title>
<style>
body{
margin:0;
background:black;
color:white;
text-align:center;
font-family:Arial;
}
video, canvas{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
}
#buttons{
position:fixed;
bottom:10px;
width:100%;
display:flex;
justify-content:center;
gap:10px;
z-index:5;
}
#buttons img{
width:80px;
border:3px solid yellow;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h2 style="position:fixed;top:5px;width:100%;z-index:5;">Vision Plus – AI Try-On</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="buttons">
<img src="frames/frame1.png" onclick="setFrame('frames/frame1.png')">
<img src="frames/frame2.png" onclick="setFrame('frames/frame2.png')">
<img src="frames/frame3.png" onclick="setFrame('frames/frame3.png')">
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let glasses = new Image();
glasses.src = "frames/frame1.png";

function setFrame(src){
glasses.src = src;
}

navigator.mediaDevices.getUserMedia({video:true}).then(stream=>{
video.srcObject = stream;
});

const faceMesh = new FaceMesh({
locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
maxNumFaces:1,
refineLandmarks:true,
minDetectionConfidence:0.7,
minTrackingConfidence:0.7
});

faceMesh.onResults(results=>{
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(video,0,0,canvas.width,canvas.height);

if(results.multiFaceLandmarks.length>0){
let p = results.multiFaceLandmarks[0];
let leftEye = p[33];
let rightEye = p[263];

let x = leftEye.x * canvas.width;
let y = leftEye.y * canvas.height;

let x2 = rightEye.x * canvas.width;
let y2 = rightEye.y * canvas.height;

let width = (x2 - x) * 2;
let height = width * 0.5;

ctx.drawImage(glasses, x - width*0.25, y - height/2, width, height);
}
});

const camera = new Camera(video,{
onFrame: async ()=>{
await faceMesh.send({image:video});
},
width:640,
height:480
});
camera.start();
</script>

</body>
</html>
