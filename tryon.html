<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
}
h1{padding:15px;}

#stage{
    position:relative;
    width:90vw;
    max-width:400px;
    margin:auto;
}

#photo{
    width:100%;
    border-radius:15px;
    display:none;
}

#frame{
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
    display:none;
    z-index:10;
}

button{
    padding:14px 30px;
    margin:10px;
    border:none;
    border-radius:12px;
    background:#ff9800;
    font-size:16px;
}

#fileInput{display:none;}
#tryNext{display:none;}
</style>
</head>

<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="stage">
    <img id="photo">
    <img id="3812-removebg-preview.png">
</div>

<button id="uploadBtn">Upload Your Photo</button>
<input type="file" id="fileInput" accept="image/*">

<br>
<button id="tryNext">Try Next Frame</button>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
const photo = document.getElementById("photo");
const frame = document.getElementById("frame");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const tryNext = document.getElementById("tryNext");

uploadBtn.onclick = ()=> fileInput.click();

fileInput.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    photo.src = URL.createObjectURL(file);
    photo.style.display="block";
    uploadBtn.style.display="none";
    tryNext.style.display="inline-block";
};

photo.onload = async ()=>{
    await loadModels();
    placeFrame();
};

async function loadModels(){
    await faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models");
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models");
}

async function placeFrame(){
    const det = await faceapi
      .detectSingleFace(photo,new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks(true);

    if(!det) return;

    const l = det.landmarks.getLeftEye();
    const r = det.landmarks.getRightEye();

    const x = (l[0].x + r[3].x)/2;
    const y = (l[0].y + r[3].y)/2;
    const w = Math.abs(r[3].x - l[0].x) * 2.2;
    const h = w * 0.5;

    frame.style.display="block";
    frame.style.width = w+"px";
    frame.style.height = h+"px";
    frame.style.left = (x - w/2)+"px";
    frame.style.top = (y - h/2)+"px";
}

tryNext.onclick = ()=> placeFrame();
</script>

</body>
</html>
