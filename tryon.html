<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
}
h1{padding:15px;}

#container{
    position:relative;
    width:90%;
    max-width:400px;
    margin:auto;
    margin-top:20px;
}

#photo{
    width:100%;
    border-radius:15px;
    display:none;
}

#frame{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    pointer-events:none;
}

.controls{
    margin:20px;
}

button{
    padding:14px 30px;
    background:#ff9800;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

input{
    margin:15px;
}
</style>
</head>

<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="container">
    <img id="photo">
    <img id="frame" src="3812-remove-preview.png">
</div>

<div class="controls">
    <input type="file" id="upload" accept="image/*">
    <br>
    <button id="next">Try Next Frame</button>
</div>

<script>
const upload = document.getElementById("upload");
const photo = document.getElementById("photo");
const frame = document.getElementById("frame");

upload.onchange = e=>{
    const file = e.target.files[0];
    if(file){
        photo.src = URL.createObjectURL(file);
        photo.style.display="block";
    }
};

photo.onload = ()=>{
    fitFrame();
};

function fitFrame(){
    const w = photo.clientWidth;
    const h = photo.clientHeight;

    // 👓 Perfect glasses position
    frame.style.width = (w * 0.7) + "px";
    frame.style.left = (w * 0.15) + "px";
    frame.style.top = (h * 0.38) + "px";
}
</script>

</body>
</html>
