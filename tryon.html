<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus AI Try-On</title>
<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:white;
text-align:center;
}

#camera{
width:100%;
max-width:400px;
border-radius:15px;
margin-top:10px;
}

#canvas{
position:absolute;
top:0;
left:0;
}

.frameBtn{
padding:10px 15px;
margin:10px;
border:none;
border-radius:10px;
font-size:16px;
background:gold;
}
</style>
</head>

<body>

<h2>Vision Plus – AI Try-On</h2>

<div style="position:relative;">
<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>
</div>

<br>

<button class="frameBtn" onclick="setFrame('frame1.png')">Frame 1</button>
<button class="frameBtn" onclick="setFrame('frame2.png')">Frame 2</button>
<button class="frameBtn" onclick="setFrame('frame3.png')">Frame 3</button>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let frameImg = new Image();

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => { video.srcObject = stream; });

function setFrame(name){
frameImg.src = "frames/" + name;
}

video.addEventListener("play",()=>{
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

setInterval(()=>{
ctx.drawImage(video,0,0,canvas.width,canvas.height);

if(frameImg.src){
ctx.drawImage(frameImg,canvas.width/2-150,canvas.height/2-80,300,120);
}

},30);
});
</script>

</body>
</html>
