<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1{padding:15px;}

#container{
  position:relative;
  width:90%;
  max-width:400px;
  margin:auto;
}

#photo{
  width:100%;
  border-radius:15px;
}

#frame{
  position:absolute;
  top:34%;
  left:50%;
  transform:translateX(-50%);
  width:72%;
  pointer-events:none;
}

.controls{
  margin:20px;
}

.upload-btn{
  background:white;
  color:black;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  display:inline-block;
}

input{display:none;}

button{
  padding:12px 25px;
  background:#ff9800;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="container">
  <img id="photo">
  <img id="frame">
</div>

<div class="controls">
  <input type="file" id="upload" accept="image/*">
  <label for="upload" class="upload-btn">Upload Your Photo</label><br>
  <button onclick="nextFrame()">Try Next Frame</button>
</div>

<script>
const photo = document.getElementById("photo");
const frame = document.getElementById("frame");

const frames = [
  "3812-removebg-preview.png"
];

let frameIndex = 0;
frame.src = frames[0];

document.getElementById("upload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(file){
    photo.src = URL.createObjectURL(file);
  }
});

function nextFrame(){
  frameIndex = (frameIndex + 1) % frames.length;
  frame.src = frames[frameIndex];
}
</script>

</body>
</html>
