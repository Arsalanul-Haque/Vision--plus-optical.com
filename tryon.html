<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
body{
  margin:0;
  background:black;
  color:white;
  text-align:center;
  font-family:Arial;
}
#wrap{
  position:relative;
  width:90%;
  max-width:400px;
  margin:auto;
}
img{
  width:100%;
}
canvas{
  position:absolute;
  left:0;
  top:0;
}
button{
  padding:12px 25px;
  margin-top:10px;
  background:orange;
  border:none;
  border-radius:10px;
  font-size:16px;
}
</style>
</head>

<body>

<h2>Vision Plus Optical – AI Try On</h2>

<input type="file" id="upload" accept="image/*"><br>
<button onclick="changeFrame()">Change Frame</button>

<div id="wrap">
  <img id="photo">
  <canvas id="canvas"></canvas>
</div>

<script>
const frames = [
"3812-removebg-preview.png"
]
let frameIndex = 0

const img = document.getElementById("photo")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models"),
faceapi.nets.faceLandmark68Net.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models")
])

document.getElementById("upload").addEventListener("change", e=>{
img.src = URL.createObjectURL(e.target.files[0])
})

img.onload = async ()=>{
canvas.width = img.width
canvas.height = img.height

const face = await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks()
if(!face){alert("Face not found"); return}

const leftEye = face.landmarks.getLeftEye()
const rightEye = face.landmarks.getRightEye()

const x = leftEye[0].x
const y = leftEye[0].y
const w = rightEye[3].x - leftEye[0].x

drawFrame(x,y,w)
}

function drawFrame(x,y,w){
ctx.clearRect(0,0,canvas.width,canvas.height)
let frame = new Image()
frame.src = frames[frameIndex]
frame.onload = ()=>{
ctx.drawImage(frame,x-w*0.3,y-w*0.6,w*2,w*0.8)
}
}

function changeFrame(){
frameIndex++
if(frameIndex>=frames.length) frameIndex=0
img.onload()
}
</script>

</body>
</html>
