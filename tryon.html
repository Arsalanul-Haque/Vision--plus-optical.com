<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical – AI Try On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
}

h1{
margin-top:20px;
}

#stage{
position:relative;
width:90%;
max-width:360px;
margin:20px auto;
border-radius:20px;
overflow:hidden;
}

#userImage{
width:100%;
border-radius:20px;
display:none;
}

#frame{
position:absolute;
top:0;
left:0;
pointer-events:none;
display:none;
}

button{
background:#ff9f00;
border:none;
padding:15px 30px;
border-radius:15px;
font-size:18px;
margin:15px;
cursor:pointer;
}

input{
display:none;
}
</style>
</head>

<body>

<h1>Vision Plus Optical – AI Try On</h1>

<div id="stage">
  <img id="userImage">
  <img id="frame">
</div>

<input type="file" id="imageUpload" accept="image/*">

<button id="uploadBtn">Upload Your Photo</button>
<button id="tryNext" style="display:none;">Try Next Frame</button>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const imageUpload = document.getElementById("imageUpload");
const userImg = document.getElementById("userImage");
const frame = document.getElementById("frame");
const tryNext = document.getElementById("tryNext");

const frames = ["3812-removebg-preview.png"];
let frameIndex = 0;

uploadBtn.onclick = () => imageUpload.click();

imageUpload.onchange = () => {
 const file = imageUpload.files[0];
 if(!file) return;
 const reader = new FileReader();
 reader.onload = () => {
   userImg.src = reader.result;
   userImg.style.display = "block";
   uploadBtn.style.display = "none";
 }
 reader.readAsDataURL(file);
};

Promise.all([
 faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models"),
 faceapi.nets.faceLandmark68Net.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/models")
]);

userImg.onload = async () => {
 tryNext.style.display="block";
 detect();
};

tryNext.onclick = () => {
 frameIndex = (frameIndex+1)%frames.length;
 frame.src = frames[frameIndex];
 detect();
};

async function detect(){
 const face = await faceapi.detectSingleFace(userImg,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
 if(!face) return;

 const left = face.landmarks.getLeftEye();
 const right = face.landmarks.getRightEye();

 const x = (left[0].x + right[3].x)/2;
 const y = (left[0].y + right[3].y)/2;
 const width = right[3].x - left[0].x;

 frame.src = frames[frameIndex];
 frame.style.display="block";
 frame.style.width = width*2 + "px";
 frame.style.left = x - width + "px";
 frame.style.top = y - width/2 + "px";
}
</script>

</body>
</html>
