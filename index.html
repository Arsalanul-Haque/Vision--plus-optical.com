<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision Plus Optical</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#111;color:#fff;padding:12px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:45px}
.search{padding:8px;border-radius:20px;border:none;width:200px}

.hero{background:#1e90ff;color:#fff;padding:12px;text-align:center}

.categories{text-align:center;padding:10px}
.cat{display:inline-block;background:#111;color:#fff;padding:8px 12px;margin:5px;border-radius:6px;cursor:pointer}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;padding:15px}
.card{background:#fff;padding:10px;border-radius:10px;box-shadow:0 0 6px rgba(0,0,0,.1);text-align:center}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.price{font-weight:bold;margin:5px 0}
.btn{background:#1e90ff;color:white;border:none;padding:6px 12px;border-radius:5px;margin:3px}

.bottom{position:fixed;bottom:10px;right:10px;background:#1e90ff;color:white;padding:14px;border-radius:50%;font-size:20px}
.home{position:fixed;bottom:10px;left:10px;background:black;color:white;padding:14px;border-radius:50%;font-size:18px}
.ai{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#ff5722;color:white;padding:12px 22px;border-radius:30px;font-weight:bold}

#cartBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;padding:15px;overflow:auto}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://uploads.onecompiler.io/44c5humbr/44c5hxnd3/2795.png">
    <b>Vision Plus Optical</b>
  </div>
  <input class="search" placeholder="🔍 Search glasses" onkeyup="search(this.value)">
</header>

<div class="hero">
📍 Pokhar ke samne, Choti Balliya, Begusarai, Bihar <br>
<a style="color:white" href="https://wa.me/917903965251">💬 Order on WhatsApp</a><br>
<a style="color:white" href="https://www.google.com/maps/search/Pokhar+ke+samne+Choti+Balliya+Begusarai+Bihar">📍 Open in Google Maps</a>
</div>

<div class="categories">
  <span class="cat" onclick="filter('sunglass')">🕶 Sunglass</span>
  <span class="cat" onclick="filter('frame')">👓 Frame</span>
  <span class="cat" onclick="filter('bluecut')">💻 Blue Cut</span>
</div>

<div class="products">

<div class="card" data-cat="sunglass" data-name="black sunglass">
<img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083">
<h4>Black Sunglass</h4>
<div class="price">₹1299</div>
<button class="btn" onclick="add('Black Sunglass',1299)">Add to Cart</button>
<button class="btn" onclick="order('Black Sunglass')">Order Now</button>
</div>

<div class="card" data-cat="frame" data-name="transparent frame">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">
<h4>Transparent Frame</h4>
<div class="price">₹1599</div>
<button class="btn" onclick="add('Transparent Frame',1599)">Add to Cart</button>
<button class="btn" onclick="order('Transparent Frame')">Order Now</button>
</div>

<div class="card" data-cat="bluecut" data-name="blue cut glass">
<img src="https://images.unsplash.com/photo-1577801597882-28c88ef7d7a9">
<h4>Blue Cut Glass</h4>
<div class="price">₹1999</div>
<button class="btn" onclick="add('Blue Cut Glass',1999)">Add to Cart</button>
<button class="btn" onclick="order('Blue Cut Glass')">Order Now</button>
</div>

</div>

<div id="cartBox">
<h2>Your Cart</h2>
<div id="cartList"></div>
<h3>Total: ₹<span id="total">0</span></h3>
<p>Pay via UPI: <b>7903965251</b></p>
<button onclick="closeCart()">Close</button>
</div>

<div class="bottom" onclick="openCart()">🛒</div>
<div class="home" onclick="location.reload()">🏠</div>
<a href="tryon.html"><div class="ai">AI Try-On</div></a>

<script>
let cart=[], total=0;

function add(n,p){cart.push(n+" ₹"+p); total+=p; alert("Added to cart")}
function openCart(){
let h=""; cart.forEach(i=>h+="<p>"+i+"</p>");
cartList.innerHTML=h; total.innerText=total; cartBox.style.display="block";
}
function closeCart(){cartBox.style.display="none"}
function order(p){window.open("https://wa.me/917903965251?text=I want to order "+p)}

function search(v){
v=v.toLowerCase();
document.querySelectorAll(".card").forEach(c=>{
c.style.display = c.dataset.name.includes(v) ? "block" : "none";
});
}
function filter(cat){
document.querySelectorAll(".card").forEach(c=>{
c.style.display = c.dataset.cat==cat ? "block" : "none";
});
}
</script>

</body>
</html>
